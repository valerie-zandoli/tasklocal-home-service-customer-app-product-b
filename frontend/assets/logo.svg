<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
  <!-- TaskLocal Home-Service mark: a simple, colorful NYC brownstone outline. -->
  <circle cx="50" cy="14" r="5" fill="#f2b134"/>

  <!-- stoop -->
  <rect x="24" y="53" width="18" height="4" rx="1" fill="#cabfa9" stroke="#1f2320" stroke-width="2"/>
  <rect x="26" y="49" width="14" height="4" rx="1" fill="#d8cfbc" stroke="#1f2320" stroke-width="2"/>

  <!-- facade -->
  <rect x="10" y="24" width="44" height="29" rx="2" fill="#d9714a" stroke="#1f2320" stroke-width="2.5"/>

  <!-- cornice -->
  <rect x="7" y="19" width="50" height="8" rx="2" fill="#2f6b4f" stroke="#1f2320" stroke-width="2.5"/>

  <!-- windows -->
  <rect x="15" y="30" width="11" height="12" rx="1" fill="#f7f1e3" stroke="#1f2320" stroke-width="2"/>
  <line x1="20.5" y1="30" x2="20.5" y2="42" stroke="#1f2320" stroke-width="1.5"/>
  <line x1="15" y1="36" x2="26" y2="36" stroke="#1f2320" stroke-width="1.5"/>

  <rect x="38" y="30" width="11" height="12" rx="1" fill="#f7f1e3" stroke="#1f2320" stroke-width="2"/>
  <line x1="43.5" y1="30" x2="43.5" y2="42" stroke="#1f2320" stroke-width="1.5"/>
  <line x1="38" y1="36" x2="49" y2="36" stroke="#1f2320" stroke-width="1.5"/>

  <!-- door -->
  <path d="M27 53 V40 a5 5 0 0 1 10 0 V53 Z" fill="#1d4433" stroke="#1f2320" stroke-width="2"/>
  <circle cx="35" cy="47" r="1.2" fill="#f7f1e3"/>
</svg>
