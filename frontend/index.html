<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskLocal Home-Service</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <noscript>
    <div class="container">
      <p>TaskLocal Home-Service requires JavaScript to be enabled in your browser.</p>
    </div>
  </noscript>
  <div class="container" id="loading-state">
    <p>Loading…</p>
  </div>

  <script src="js/config.js"></script>
  <script type="module">
    import { getSession } from "./js/api.js";
    try {
      const session = await getSession();
      window.location.replace(session ? "listings.html" : "login.html");
    } catch (err) {
      document.getElementById("loading-state").innerHTML =
        `<p class="error-text">Something went wrong loading TaskLocal Home-Service. Please refresh the page.</p>`;
      console.error(err);
    }
  </script>
</body>
</html>
