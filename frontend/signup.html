<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)" />
  <title>Sign up · TaskLocal | Customer Booking</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <noscript>
    <div class="container">
      <p>TaskLocal | Customer Booking requires JavaScript to be enabled in your browser.</p>
    </div>
  </noscript>
  <main class="auth-shell">
    <div class="auth-card">
      <img class="auth-logo" src="assets/logo.svg" alt="" width="56" height="56" />
      <h1>Create your account</h1>
      <p class="subtitle">Sign up to browse and book local home services.</p>

      <form id="signup-form" novalidate>
        <label for="display-name">Name</label>
        <input id="display-name" type="text" autocomplete="name" required />

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />

        <label for="password">Password</label>
        <!-- No `name` attribute, matching login.html: JS reads these by id,
             and a `name` here would let a native (no-JS) form submission
             leak the password into the URL query string via a GET fallback. -->
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <p class="field-hint">At least 8 characters.</p>

        <button class="primary" type="submit">Sign up</button>
        <p class="error-text" id="error-text" aria-live="polite"></p>
        <p class="success-text" id="success-text" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/set-manifest-theme.js"></script>
  <script src="js/error-reporter.js"></script>
  <script src="js/register-sw.js"></script>
  <script type="module" src="js/page-signup.js"></script>
</body>
</html>
