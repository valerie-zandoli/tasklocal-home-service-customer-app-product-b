name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # jsdom (frontend/package.json) is the one external dependency the
      # suite has, needed for nav.test.mjs's DOM-level tests — everything
      # else still uses only Node's built-in test runner and assert module.
      - run: npm install
        working-directory: frontend
      - run: node --test frontend/js/*.test.mjs

  # DELIBERATELY DEPLOYS TO PREVIEW, NOT PRODUCTION. Do not add --prod back
  # to the three vercel commands below without reading this comment fully.
  #
  # An earlier version of this job used --prod and broke the live site: the
  # root path (/) 404'd for several minutes for real visitors. `vercel build`
  # + `vercel deploy --prebuilt` (the officially documented CI pattern)
  # generates a different routing config than Vercel's own managed build
  # pipeline does, and that difference broke root-path routing in a way that
  # `node --test` couldn't catch (it never loaded the actual deployed site).
  # Restored at the time by reverting to a direct `vercel --prod` deploy, not
  # by finding the root cause.
  #
  # The root cause is understood and fixed now (see README) — plus two more
  # rounds of routing/header bugs found and fixed the same way — and every
  # one of those checks is now the smoke-test step below, so a future
  # vercel.json regression fails this job instead of needing to be caught by
  # hand again. This job still targets preview, not production: the
  # remaining condition for flipping these three commands to --prod is a
  # run of consecutive clean runs on real pushes (the smoke test passing
  # counts as "clean" now, not just "the job didn't error"), then disabling
  # Vercel's own Git-integration auto-deploy in the dashboard.
  deploy-preview:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_cNKzyJkeUUeKDhhr8dG471Hx
      VERCEL_PROJECT_ID: prj_UsLkJbtLe1tjrKkWoUCeiqF9aBhi
      # Job-level, not per-command: scripts/smoke-test-deployment.sh's own
      # `vercel curl` calls need to authenticate too, and the CLI picks this
      # env var up automatically without needing --token threaded through.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global vercel@59.1.3
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to preview
        id: deploy
        run: |
          # vercel deploy also prints a full JSON summary block when not
          # attached to a TTY (as in CI) -- `| tail -1` alone grabs that
          # block's closing brace, not a URL. Extract it properly instead.
          out=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]*\.vercel\.app' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Could not extract a deployment URL from vercel deploy's output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Written after three consecutive rounds of routing/header bugs that
      # only ever got caught by manually re-running these checks by hand —
      # see the script itself and the README for why this exists.
      - name: Smoke-test the deployed routing/headers
        run: ./scripts/smoke-test-deployment.sh "${{ steps.deploy.outputs.url }}"
