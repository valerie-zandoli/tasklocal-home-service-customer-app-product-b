name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # jsdom (frontend/package.json) is the one external dependency the
      # suite has, needed for nav.test.mjs's DOM-level tests — everything
      # else still uses only Node's built-in test runner and assert module.
      - run: npm install
        working-directory: frontend
      - run: node --test frontend/js/*.test.mjs

  # DEPLOYS TO PRODUCTION. This job spent a long stretch of this project's
  # history deploying to preview only, on purpose — an earlier version used
  # --prod directly and broke the live site (root path 404ing for real
  # visitors) because `vercel build` + `vercel deploy --prebuilt` generates a
  # different routing config than Vercel's own managed build pipeline, in a
  # way `node --test` had no way to catch. That was restored at the time by
  # reverting to a manual `vercel --prod` deploy, not by understanding why.
  #
  # The actual root cause (a `check: true` rewrite re-running the whole
  # route table and self-redirecting) is understood and fixed now, two more
  # rounds of routing/header bugs turned up and got fixed the same way, and
  # every one of those checks is what scripts/smoke-test-deployment.sh runs
  # below — proven to actually fail on the historical broken configs, not
  # just pass today. Flipped to --prod after a long run of consecutive clean
  # deploy-preview executions across several unrelated later changes.
  #
  # Vercel's own Git-integration auto-deploy is STILL ENABLED in the
  # dashboard as of this flip — deliberately, as a redundant safety net
  # while this path proves itself against production for real. Once this
  # has run clean a few times for real, disable it (Settings → Git →
  # Ignored Build Step) so this job is the only path to production, per the
  # original point of doing any of this: making deployment actually
  # CI-gated, not decorative.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_cNKzyJkeUUeKDhhr8dG471Hx
      VERCEL_PROJECT_ID: prj_UsLkJbtLe1tjrKkWoUCeiqF9aBhi
      # Job-level, not per-command: scripts/smoke-test-deployment.sh's own
      # `vercel curl` calls need to authenticate too, and the CLI picks this
      # env var up automatically without needing --token threaded through.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global vercel@59.1.3
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        id: deploy
        run: |
          # vercel deploy also prints a full JSON summary block when not
          # attached to a TTY (as in CI) -- `| tail -1` alone grabs that
          # block's closing brace, not a URL. Extract it properly instead.
          out=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]*\.vercel\.app' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Could not extract a deployment URL from vercel deploy's output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Written after three consecutive rounds of routing/header bugs that
      # only ever got caught by manually re-running these checks by hand —
      # see the script itself and the README for why this exists.
      - name: Smoke-test the deployed routing/headers
        run: ./scripts/smoke-test-deployment.sh "${{ steps.deploy.outputs.url }}"
