name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # No npm install: these tests use only Node's built-in test runner and
      # assert module, zero external dependencies, by design (see
      # frontend/js/api.test.mjs and utils.test.mjs).
      - run: node --test frontend/js/*.test.mjs

  # DELIBERATELY DEPLOYS TO PREVIEW, NOT PRODUCTION. Do not add --prod back
  # to the three vercel commands below without reading this comment fully.
  #
  # An earlier version of this job used --prod and broke the live site: the
  # root path (/) 404'd for several minutes for real visitors. `vercel build`
  # + `vercel deploy --prebuilt` (the officially documented CI pattern)
  # generates a different routing config than Vercel's own managed build
  # pipeline does, and that difference broke root-path routing in a way that
  # wasn't caught by `node --test` (there's no test that loads the actual
  # deployed site). It was fixed by reverting to a direct `vercel --prod`
  # deploy, not by finding the actual root cause in the CI build path.
  #
  # So this job now targets preview on every push to main instead — it
  # keeps exercising the pull/build/deploy mechanics and proving (or
  # disproving) itself safely, with zero risk to the live site, since a
  # preview URL is disposable. Once several consecutive preview runs are
  # clean AND the root-path routing difference above is actually understood
  # (not just proven "went away this time"), deliberately flip these three
  # commands to --prod, change the `if` condition below back to gating real
  # deploys, and only then follow through on disabling Vercel's own
  # Git-integration auto-deploy in the dashboard — see README.
  deploy-preview:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_cNKzyJkeUUeKDhhr8dG471Hx
      VERCEL_PROJECT_ID: prj_UsLkJbtLe1tjrKkWoUCeiqF9aBhi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm install --global vercel@59.1.3
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
