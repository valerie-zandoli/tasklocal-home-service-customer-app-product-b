name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # No npm install: these tests use only Node's built-in test runner and
      # assert module, zero external dependencies, by design (see
      # frontend/js/api.test.mjs and utils.test.mjs).
      - run: node --test frontend/js/*.test.mjs
