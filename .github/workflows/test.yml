name: Tests

on:
  push:
  pull_request:
  # Catches a slot aging into the past (data-integrity.test.mjs) between
  # pushes, not only on the next one -- this same class of bug has now
  # recurred multiple times because static seed dates keep drifting behind
  # whatever "today" actually is. 13:00 UTC is arbitrary; only the daily
  # cadence matters. The `deploy` job below stays untouched by this: its
  # own `if` already requires `github.event_name == 'push'`, which a
  # scheduled run never satisfies, so this can never trigger a production
  # release on its own.
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # jsdom (frontend/package.json) is the one external dependency the
      # suite has, needed for nav.test.mjs's DOM-level tests — everything
      # else still uses only Node's built-in test runner and assert module.
      #
      # npm ci, not npm install: install fails loudly if package.json and
      # package-lock.json have drifted, and always installs exactly what's
      # locked rather than letting a stale lockfile silently update — the
      # same exact-reproducibility standard already applied everywhere else
      # in this pipeline (SHA-pinned actions, the exact-pinned esm.sh
      # import, axe-core pinned to 4.13.0 not ^4.13.0).
      - run: npm ci
        working-directory: frontend
      # @supabase/supabase-js (backend/package.json), used by
      # scripts/seed-demo-users.mjs. Backend has no tests of its own to run
      # here, just this audit — installed only so the audit has a lockfile
      # to check.
      - run: npm ci
        working-directory: backend
      # npm audit exits non-zero on any known vulnerability, so this fails
      # the build rather than just reporting — a one-off manual run found 0
      # vulnerabilities in both packages, but that was a single check done
      # by hand, not something that would ever notice a vulnerability
      # disclosed later against an already-pinned version.
      - run: npm audit
        working-directory: frontend
      - run: npm audit
        working-directory: backend
      # --experimental-test-coverage: page-index.js/page-login.js/
      # page-listing.js/page-listings.js/error-reporter.js's own tests import
      # their entry module with a fresh cache-busting query string per test
      # (see those test files' own comments for why — the modules run
      # entirely as a top-level side effect on import, so a second plain
      # import would return Node's already-executed cached module and
      # silently no-op). That confirmed-via-repro breaks coverage
      # *attribution* for those five files specifically: V8 only reports the
      # last-loaded instance's counters, silently discarding what earlier
      # cache-busted imports in the same file covered. Their reported
      # numbers are real but understate actual coverage — treat a low number
      # there as inconclusive, not as a gap to chase, unless you've
      # confirmed a specific line really is untested. api.js and every other
      # file don't have this problem (imported normally, not cache-busted),
      # so their numbers are trustworthy as reported.
      - run: node --test --experimental-test-coverage frontend/js/*.test.mjs

  # DEPLOYS TO PRODUCTION. This job spent a long stretch of this project's
  # history deploying to preview only, on purpose — an earlier version used
  # --prod directly and broke the live site (root path 404ing for real
  # visitors) because `vercel build` + `vercel deploy --prebuilt` generates a
  # different routing config than Vercel's own managed build pipeline, in a
  # way `node --test` had no way to catch. That was restored at the time by
  # reverting to a manual `vercel --prod` deploy, not by understanding why.
  #
  # The actual root cause (a `check: true` rewrite re-running the whole
  # route table and self-redirecting) is understood and fixed now, two more
  # rounds of routing/header bugs turned up and got fixed the same way, and
  # every one of those checks is what scripts/smoke-test-deployment.sh runs
  # below — proven to actually fail on the historical broken configs, not
  # just pass today. Flipped to --prod after a long run of consecutive clean
  # deploy-preview executions across several unrelated later changes.
  #
  # Deploy and promote are deliberately separate steps (--skip-domain, then
  # `vercel promote`), not `vercel deploy --prod` doing both at once. That
  # used to alias the production domain to the new deployment immediately,
  # *before* the smoke test below had run — meaning a bad deployment was
  # already live for however long the smoke test took to fail. Building the
  # concurrency group below surfaced that this could get worse, not just
  # stay narrow: cancel-in-progress can kill a still-running smoke-test step
  # outright if a newer push arrives mid-test, leaving production on
  # never-verified code with the run showing as merely "cancelled" in CI
  # history — easy to read as "superseded, nothing to see" rather than as
  # the warning it actually is. Deploying with the domain unaliased and only
  # promoting after the smoke test exits 0 means neither failure nor
  # cancellation can ever leave unverified code live: the alias simply isn't
  # touched until verification has actually finished and passed.
  #
  # Vercel's own Git-integration auto-deploy is STILL ENABLED in the
  # dashboard as of the --prod flip — deliberately, as a redundant safety
  # net while this path proves itself against production for real. Once
  # this has run clean a few times for real, disable it (Settings → Git →
  # Ignored Build Step) so this job is the only path to production, per the
  # original point of doing any of this: making deployment actually
  # CI-gated, not decorative.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Two pushes landing close together would otherwise run two deploys in
    # parallel with no ordering guarantee. `cancel-in-progress` means a
    # newer push cancels an older push's still-running deploy rather than
    # racing it — safe now that promotion (see below) only happens after a
    # deploy's own smoke test has already passed, so a cancelled run can
    # only ever leave the *previous* good deployment live, never a
    # half-verified one.
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: team_cNKzyJkeUUeKDhhr8dG471Hx
      VERCEL_PROJECT_ID: prj_UsLkJbtLe1tjrKkWoUCeiqF9aBhi
      # Job-level, not per-command: scripts/smoke-test-deployment.sh's own
      # `vercel curl` calls need to authenticate too, and the CLI picks this
      # env var up automatically without needing --token threaded through.
      #
      # Rotated 2026-08-25 after the previous value was pasted in plaintext
      # into a chat interface — treated as compromised on principle (not
      # because of any confirmed misuse) and replaced immediately. Took two
      # more attempts to get right, both failing here with "Could not
      # retrieve Project Settings": the account only has one team
      # (valerie-zandoli-1, matching the ID above, so "wrong team" wasn't
      # actually possible) — the real cause was a token restricted to
      # "Has access to this project" only, a narrower token type that
      # doesn't carry enough permission for vercel pull/build/deploy/
      # promote even though it's scoped to the right project. Needs full
      # account/team access, not a project-restricted token. If a deploy
      # ever starts failing here with an auth error again, check that
      # specifically before assuming something else broke.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global vercel@59.1.3
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (production build, domain not yet aliased)
        id: deploy
        run: |
          # --skip-domain: still a production-target deployment (matches the
          # production env `vercel build --prod` just built with), but the
          # production domain isn't aliased to it yet — that only happens in
          # the explicit `vercel promote` step below, after the smoke test
          # passes. See the comment above the `deploy:` job for why this is
          # split instead of letting `--prod` alias immediately.
          #
          # vercel deploy also prints a full JSON summary block when not
          # attached to a TTY (as in CI) -- `| tail -1` alone grabs that
          # block's closing brace, not a URL. Extract it properly instead.
          out=$(vercel deploy --prebuilt --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]*\.vercel\.app' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Could not extract a deployment URL from vercel deploy's output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Written after three consecutive rounds of routing/header bugs that
      # only ever got caught by manually re-running these checks by hand —
      # see the script itself and the README for why this exists. Runs
      # against the unaliased deployment URL from above, so a failure here
      # (non-zero exit) stops the job and skips the promote step next —
      # the production domain never moves toward code that failed this.
      - name: Smoke-test the deployed routing/headers
        run: ./scripts/smoke-test-deployment.sh "${{ steps.deploy.outputs.url }}"
      - name: Promote to production
        run: vercel promote "${{ steps.deploy.outputs.url }}" --yes --token=${{ secrets.VERCEL_TOKEN }}
