name: CodeQL

# No dedicated build step needed: JavaScript/TypeScript analysis reads the
# source directly, and this repo has no compile step (frontend/ is plain
# HTML/CSS/JS, no bundler) for CodeQL to need to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Offset from test.yml's daily 13:00 UTC schedule run -- weekly is enough
  # for a scan of code that otherwise only changes on push/PR.
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: "/language:javascript-typescript"
