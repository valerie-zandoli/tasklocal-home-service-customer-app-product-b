name: Performance trend

# frontend/e2e/performance.spec.mjs and performance-throttled.spec.mjs are
# real, live-network Playwright tests -- read-only against the live
# Supabase project (no booking created, unlike core-flows.spec.mjs), so
# unlike live-tests.yml this doesn't leave any row behind. Still kept off
# the every-push gate (test.yml): the point of these specs is a budget
# check plus a per-run numbers snapshot, and running Playwright against a
# real network on every push would add real time and real flakiness to a
# gate that's supposed to stay fast. Weekly is enough to catch a slow
# creep in page weight/load time between runs -- see performance.spec.mjs's
# own comment on why a per-run number, not just pass/fail, is the point.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --project=desktop-light --project=throttled-mobile e2e/performance.spec.mjs e2e/performance-throttled.spec.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-results
          path: frontend/performance-results.json
          if-no-files-found: warn
