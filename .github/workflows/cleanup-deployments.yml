name: Clean up stale Vercel deployments

# scripts/cleanup-deployments.sh existed but was only ever run by hand --
# 31 stale, almost entirely superseded deployments piled up before anyone
# noticed and wrote the script in the first place. Vercel doesn't auto-prune
# deployments, and this repo's deploy job creates a new one on every push to
# main, so the same accumulation will recur unless this runs on its own
# cadence. --safe (baked into the script itself) means it can never remove
# a deployment holding an active alias, so the live production deployment
# is never at risk regardless of when this fires.
on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global vercel@59.1.3
      - name: Remove unaliased deployments
        env:
          VERCEL_ORG_ID: team_cNKzyJkeUUeKDhhr8dG471Hx
          VERCEL_PROJECT_ID: prj_UsLkJbtLe1tjrKkWoUCeiqF9aBhi
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: ./scripts/cleanup-deployments.sh
